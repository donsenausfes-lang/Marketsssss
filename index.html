<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krayv Shop</title>

<style>
  * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease; }
  :root {
    --bg: #fff; --text: #000; --card-bg: #f5f5f7;
    --card-border: rgba(0,0,0,0.08); --muted: #888;
    --accent: #2481cc; --accent-text: #fff;
    --overlay: rgba(0,0,0,0.5); --qty-bg: #e5e5e5;
    --remove-bg: #ffdddd; --remove-text: #c00; --divider: #eee;
    --green: #22c55e;
  }
  body.dark {
    --bg: #0f0f14; --text: #fff; --card-bg: #1c1c22;
    --card-border: rgba(255,255,255,0.08); --muted: #999;
    --overlay: rgba(0,0,0,0.7); --qty-bg: #2c2c33;
    --remove-bg: #4a1f1f; --remove-text: #ff8888; --divider: #2a2a33;
  }
  body.beige {
    --bg: #f0e6d2; --text: #3a2f1e; --card-bg: #e6d9bf;
    --card-border: rgba(0,0,0,0.12); --muted: #8a7a5c;
    --accent: #c9a227; --overlay: rgba(60,40,10,0.5);
    --qty-bg: #d9c8a8; --remove-bg: #f5d0c5;
    --remove-text: #a0321c; --divider: #d4c3a3;
  }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 16px; padding-top: 60px; padding-bottom: 100px; min-height: 100vh;
  }
  .top-bar { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 200; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--card-bg); border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
  }
  .shop-title { font-size: 26px; font-weight: 800; color: #2481cc; margin: 0 0 10px 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--divider); }
  .tab {
    flex: 1; padding: 10px 6px; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--muted);
    background: transparent; border: none;
    border-bottom: 2px solid transparent; cursor: pointer;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    align-items: stretch;
  }
  .card {
    border: 1px solid var(--card-border); border-radius: 12px;
    padding: 10px; background: var(--card-bg); cursor: pointer;
    display: flex; flex-direction: column;
    height: 100%;
  }
  .card-img-wrap { width: 100%; aspect-ratio: 1/1; overflow: hidden; border-radius: 8px; margin-bottom: 8px; background: #000; flex-shrink: 0; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card h3 { font-size: 15px; margin: 0 0 4px 0; }
  .card .desc { font-size: 12px; color: var(--muted); margin: 0 0 6px 0; flex: 1; }
  .card .price { font-size: 15px; font-weight: 600; margin: 0 0 8px 0; }
  .card button {
    width: 100%; padding: 8px; border-radius: 8px; border: none;
    background: var(--accent); color: var(--accent-text);
    font-size: 14px; cursor: pointer;
    margin-top: auto;
  }
  .card button:disabled { background: var(--qty-bg); color: var(--muted); cursor: not-allowed; }
  .card .old-price { font-size: 12px; color: var(--muted); text-decoration: line-through; margin-left: 6px; font-weight: 400; }
  .floating {
    position: fixed; bottom: 20px; right: 20px;
    padding: 12px 20px; border-radius: 30px; border: none;
    background: var(--accent); color: var(--accent-text);
    font-size: 15px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); cursor: pointer; z-index: 50;
  }
  .overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: none; align-items: flex-end; z-index: 100;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-height: 92vh; overflow-y: auto;
    background: var(--bg); border-top-left-radius: 20px; border-top-right-radius: 20px;
    padding: 20px;
  }
  .sheet h2 { margin: 0 0 12px 0; font-size: 20px; }
  .close {
    width: 100%; margin-top: 12px; padding: 10px;
    border-radius: 12px; border: none; background: transparent;
    color: var(--muted); font-size: 14px; cursor: pointer;
  }
  .order {
    width: 100%; margin-top: 12px; padding: 14px;
    border-radius: 12px; border: none;
    background: var(--accent); color: var(--accent-text);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .item {
    padding: 10px; border-radius: 10px; background: var(--card-bg); margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .item .name { font-size: 14px; font-weight: 600; }
  .item .line { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .remove {
    width: 26px; height: 26px; border-radius: 6px; border: none;
    background: var(--remove-bg); color: var(--remove-text); cursor: pointer;
  }
  .totals { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--divider); font-size: 14px; }
  .totals .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .totals .final { font-size: 17px; font-weight: 700; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--divider); }
  .step { display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: var(--card-bg); margin-bottom: 8px; }
  .step-num {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text);
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step-text { font-size: 13px; line-height: 1.45; }
  .link { color: var(--accent); text-decoration: none; font-weight: 600; }
  .amount { color: var(--green); font-weight: 700; }
  .price-option {
    padding: 14px; border-radius: 10px; background: var(--card-bg);
    border: 2px solid transparent; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; font-size: 15px;
  }
  .price-option.selected { border-color: var(--accent); }
  .price-option .label { font-weight: 600; }
  .price-option .value { font-weight: 700; color: var(--accent); }
</style>
</head>

        </div>
      </div>
      <button class="close" onclick="closeAll()">Закрыть</button>
    </div>

    <div id="checkoutView" style="display:none;">
      <h2>Оформление заказа</h2>
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">Убедитесь, что на вашем балансе достаточно звёзд</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text" id="payToBlock"></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text" id="payDetailsBlock"></div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div class="step-text">
          Ожидайте проверки и выдачи заказа вплоть до 4 часов.
          Если мы опоздаем — вернём <b>10%</b> от заказа
          на все товары, кроме NFT.
        </div>
      </div>
      <div style="margin-top:14px;margin-bottom:6px;text-align:center;font-size:14px;font-weight:600;color:var(--green);">Удачных покупок 🛍️</div>
      <button class="close" onclick="backToCart()">← Назад в корзину</button>
    </div>

  </div>
</div>

(function() {
  const saved = localStorage.getItem("krayv-theme") || "dark";
  document.body.classList.remove("dark", "beige");
  if (saved === "dark") document.body.classList.add("dark");
  if (saved === "beige") document.body.classList.add("beige");
})();

function setTheme(name) {
  document.body.classList.remove("dark", "beige");
  if (name === "dark") document.body.classList.add("dark");
  if (name === "beige") document.body.classList.add("beige");
  localStorage.setItem("krayv-theme", name);
}

function switchTab(section, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("tab-" + section).classList.add("active");
}

function openSheet(viewId) {
  document.querySelectorAll(".sheet > div").forEach(el => el.style.display = "none");
  document.getElementById(viewId).style.display = "block";
  document.getElementById("overlay").classList.add("open");
}

function overlayClick(e) {
  if (e.target.id !== "overlay") return;
  closeAll();
}

function closeAll() {
  document.getElementById("overlay").classList.remove("open");
}

function openSettings() {
  openSheet("settingsView");
}

function formatPrice(p) {
  if (p.isNegotiable) return "Договорная";
  if (p.priceOptions && p.priceOptions.length) {
    const min = Math.min(...p.priceOptions.map(o => o.value));
    return "от " + min + " ⭐";
  }
  return p.price + " ⭐";
}

function renderSection(sectionId, containerId) {
  const items = products.filter(p => p.section === sectionId);
  document.getElementById(containerId).innerHTML = items.map(p => {
    const inCart = cart.find(i => i.product.id === p.id);
    const disabled = inCart && !p.allowMultiple;
    let btnText = "В корзину";
    if (inCart && !p.allowMultiple) btnText = "Уже в корзине";
    if (inCart && p.allowMultiple) btnText = "Ещё +1";

    let priceHtml = formatPrice(p);
    if (p.oldPrice) priceHtml += ` <span class="old-price">${p.oldPrice} ⭐</span>`;

    return `
    <div class="card">
      <div class="card-img-wrap" onclick="openProduct(${p.id})">
        <img src="${p.image}" alt="${p.name}">
      </div>
      <h3 onclick="openProduct(${p.id})">${p.name}</h3>
      <p class="desc" onclick="openProduct(${p.id})">${p.description}</p>
      <p class="price" onclick="openProduct(${p.id})">${priceHtml}</p>
      <button onclick="event.stopPropagation(); addToCart(${p.id})" ${disabled ? "disabled" : ""}>
        ${btnText}
      </button>
    </div>`;
  }).join("");
}

function renderGrid() {
  renderSection("eng", "grid-eng");
  renderSection("gifts", "grid-gifts");
   }
 function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProductId = id;
  selectedOptionIdx = 0;

  document.getElementById("pBigImg").src = p.image;
  document.getElementById("pName").textContent = p.name;
  document.getElementById("pDesc").textContent = p.description;

  const block = document.getElementById("pPriceBlock");

  if (p.priceOptions && p.priceOptions.length) {
    block.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        ${p.priceOptions.map((o, idx) => `
          <div class="price-option ${idx === 0 ? 'selected' : ''}"
               onclick="selectOption(${idx})">
            <span class="label">${o.label}</span>
            <span class="value">${o.value} ⭐</span>
          </div>
        `).join("")}
      </div>
    `;
  } else {
    let priceHtml;
    if (p.isNegotiable) {
      priceHtml = "Договорная";
    } else {
      priceHtml = p.price + " ⭐";
      if (p.oldPrice) priceHtml += ` <span class="old-price">${p.oldPrice} ⭐</span>`;
    }
    block.innerHTML = `<p style="font-size:20px;font-weight:800;color:var(--accent);margin:0 0 16px 0;">${priceHtml}</p>`;
  }

  const btn = document.getElementById("pAddBtn");
  const inCart = cart.find(i => i.product.id === id);
  if (inCart && !p.allowMultiple) {
    btn.disabled = true;
    btn.textContent = "Уже в корзине";
  } else {
    btn.disabled = false;
    btn.textContent = "В корзину";
  }

  openSheet("productView");
}

function selectOption(idx) {
  selectedOptionIdx = idx;
  document.querySelectorAll(".price-option").forEach((el, i) => {
    el.classList.toggle("selected", i === idx);
  });
}

function closeProduct() {
  if (cart.length > 0) openCart();
  else closeAll();
}

function addFromProductView() {
  const p = products.find(x => x.id === currentProductId);
  if (!p) return;

  let finalPrice = p.price;
  let optionLabel = null;

  if (p.priceOptions && p.priceOptions.length) {
    const opt = p.priceOptions[selectedOptionIdx];
    finalPrice = opt.value;
    optionLabel = opt.label;
  }

  const existing = getItem(p.id);
  if (existing) {
    if (!p.allowMultiple) {
      closeProduct();
      return;
    }
    existing.qty += 1;
  } else {
    cart.push({ product: p, qty: 1, chosenPrice: finalPrice, optionLabel });
  }

  renderGrid();
  renderCart();
  closeProduct();
}

function getItem(id) {
  return cart.find(i => i.product.id === id);
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  if (p.priceOptions && p.priceOptions.length) {
    openProduct(id);
    return;
  }

  const existing = getItem(id);
  if (existing) {
    if (!p.allowMultiple) return;
    existing.qty += 1;
  } else {
    cart.push({ product: p, qty: 1, chosenPrice: p.price, optionLabel: null });
  }
  renderGrid();
  renderCart();
}

function increaseQty(id) {
  const item = getItem(id);
  if (!item || !item.product.allowMultiple) return;
  item.qty += 1;
  renderGrid();
  renderCart();
}

function decreaseQty(id) {
  const item = getItem(id);
  if (!item) return;
  item.qty -= 1;
  if (item.qty <= 0) cart = cart.filter(i => i.product.id !== id);
  renderGrid();
  renderCart();
}

function removeFromCart(id) {
  cart = cart.filter(i => i.product.id !== id);
  renderGrid();
  renderCart();
}

function linePrice(item) {
  return (item.chosenPrice || item.product.price) * item.qty;
}

function baseSum() {
  return cart.reduce((s, i) => s + linePrice(i), 0);
}

function commissionSum() {
  return cart.reduce((s, i) => {
    if (i.product.noCommission) return s;
    return s + linePrice(i) * 0.2;
  }, 0);
}

function totalSum() {
  return baseSum() + commissionSum();
}

function totalCount() {
  return cart.reduce((s, i) => s + i.qty, 0);
}

function renderCart() {
  document.getElementById("cartCount").textContent =
    totalCount() > 0 ? "(" + totalCount() + ")" : "";
  const c = document.getElementById("cartContent");
  if (!c) return;

  if (cart.length === 0) {
    c.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px 0;">Пока пусто</p>' +
                  '<button class="close" onclick="closeAll()">Закрыть</button>';
    return;
  }

  let itemsHtml = cart.map(i => {
    const unitPrice = i.chosenPrice || i.product.price;
    const lineSum = unitPrice * i.qty;
    const comm = i.product.noCommission ? 0 : lineSum * 0.2;
    const commText = i.product.noCommission ? "Без комиссии" : "+ " + comm.toFixed(0) + " ⭐ комиссия";
    const variantText = i.optionLabel ? " (" + i.optionLabel + ")" : "";

    const qtyControls = i.product.allowMultiple ? `
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px;">
        <button onclick="decreaseQty(${i.product.id})" style="width:26px;height:26px;border-radius:6px;border:none;background:var(--qty-bg);color:var(--text);cursor:pointer;">−</button>
        <span style="min-width:24px;text-align:center;">${i.qty}</span>
        <button onclick="increaseQty(${i.product.id})" style="width:26px;height:26px;border-radius:6px;border:none;background:var(--qty-bg);color:var(--text);cursor:pointer;">+</button>
      </div>
    ` : "";

    return `
    <div class="item">
      <div style="flex:1;">
        <div class="name">${i.product.name}${variantText}</div>
        <div class="line">${unitPrice} ⭐ × ${i.qty} = ${lineSum} ⭐</div>
        <div class="line">${commText}</div>
        ${qtyControls}
      </div>
      <button class="remove" onclick="removeFromCart(${i.product.id})">✕</button>
    </div>`;
  }).join("");

  const base = baseSum();
  const comm = commissionSum();
  const total = base + comm;

  itemsHtml += `
    <div class="totals">
      <div class="row"><span>Товары:</span><span>${base} ⭐</span></div>
      ${comm > 0 ? `<div class="row" style="color:var(--muted);font-size:13px;"><span>Комиссия (+20%):</span><span>+${comm.toFixed(0)} ⭐</span></div>` : ""}
      <div class="row final"><span>Итого:</span><span>${total.toFixed(0)} ⭐</span></div>
    </div>
    <button class="order" onclick="showCheckout()">Оформить заказ</button>
    <button class="close" onclick="closeAll()">Закрыть</button>
  `;
  c.innerHTML = itemsHtml;
}

function openCart() {
  renderCart();
  openSheet("cartView");
}

function showCheckout() {
  if (cart.length === 0) return;

  const sellers = { krayv: 0, arhangel: 0, bitch: 0, clardus: 0 };
  let hasAd = false;

  cart.forEach(i => {
    const unitPrice = i.chosenPrice || i.product.price;
    const lineSum = unitPrice * i.qty;
    const comm = i.product.noCommission ? 0 : lineSum * 0.2;
    const total = lineSum + comm;
    let seller = i.product.seller || "krayv";
    if (!i.product.seller) {
      if (i.product.name && i.product.name.includes("Arhangel")) seller = "arhangel";
      else if (i.product.name && i.product.name.includes("с!иртей")) seller = "bitch";
    }
    if (seller === "clardus") hasAd = true;
    sellers[seller] += total;
  });

  const active = Object.keys(sellers).filter(k => sellers[k] > 0);
  const links = {
    krayv: "@krayverov",
    arhangel: "@Arhangelovofficiall",
    bitch: "@bitchverification",
    clardus: "@clardus"
  };

  if (hasAd) {
    document.getElementById("payToBlock").innerHTML =
      "Напишите в личку <span class='link'>@clardus</span>";
    document.getElementById("payDetailsBlock").innerHTML =
      "Обсудите с ним условия рекламы и отправьте звёзды подарками.";
  } else {
    const names = active.map(k => `<span class="link">${links[k]}</span>`).join(" и ");
    document.getElementById("payToBlock").innerHTML = "Напишите в личку " + names;

    if (active.length === 1) {
      const k = active[0];
      document.getElementById("payDetailsBlock").innerHTML =
        `Отправьте звёзды подарками на сумму <span class="amount">${sellers[k].toFixed(0)}</span> ⭐ ` +
        `на <span class="link">${links[k]}</span> и отметьте под 1 из подарков то, что вы купили.<br>` +
        `Пример: колечко и ракету с подписью «за деф»`;
    } else {
      let html = "Отправьте звёзды подарками разным продавцам:<br>";
      active.forEach(k => {
        html += `• <span class="link">${links[k]}</span> — <span class="amount">${sellers[k].toFixed(0)}</span> ⭐<br>`;
      });
      html += "И подпишите, что именно вы купили у каждого.";
      document.getElementById("payDetailsBlock").innerHTML = html;
    }
  }

  openSheet("checkoutView");
}

function backToCart() {
  openCart();
 }
 
  renderGrid();
  renderCart();
</script>
